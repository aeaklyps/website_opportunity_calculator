<!DOCTYPE html>
<html>
<head>
    <title>Website Opportunity Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Website Opportunity Checker</h1>

    <input id="business" placeholder="Business name">
    <input id="website" placeholder="Website URL">

    <h3>Website Evaluation</h3>

    <label><input type="checkbox" id="mobile"> Mobile friendly</label>
    <label><input type="checkbox" id="contact"> Contact information</label>
    <label><input type="checkbox" id="cta"> Clear call-to-action</label>
    <label><input type="checkbox" id="social"> Social media links</label>
    <label><input type="checkbox" id="design"> Modern design</label>

    <button onclick="analyze()">Analyze Website</button>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
