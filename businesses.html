<!DOCTYPE html>
<html>
<head>
    <title>SUTÉRA — Saved Businesses</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="grid-background"></div>

    <div class="container page-container">

        <a href="index.html" class="back-link">← RETURN HOME</a>

        <div class="brand">
            SUTÉRA
            <span>SYSTEMS // BUSINESS DATABASE</span>
        </div>

        <div class="page-layout">

            <div class="business-section">

                <p class="eyebrow">DATABASE // OPPORTUNITIES</p>

                <h1>SAVED BUSINESSES</h1>

                <div class="sort-area">

                    <label for="sort">ORGANIZE BY</label>

                    <select id="sort" onchange="displayBusinesses()">
                        <option value="priority">
                            PRIORITY: HIGH → LOW
                        </option>

                        <option value="recent">
                            MOST RECENTLY TESTED
                        </option>
                    </select>

                </div>

                <div id="businessList"></div>

                <a href="tester.html" class="main-button small-button">
                    TEST NEW WEBSITE
                </a>

            </div>

            <div class="side-flower business-flower">
                <img src="flower.png" class="flower" alt="">
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
